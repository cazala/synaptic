<!doctype html>
<meta charset="utf-8">
<title>Synaptic WebGPU learning workloads</title>
<script type="importmap">
{
  "imports": {
    "@synaptic/core": "/packages/core/dist/index.js",
    "@synaptic/layers": "/packages/layers/dist/index.js",
    "@synaptic/backend-cpu": "/packages/backend-cpu/dist/index.js",
    "@synaptic/backend-wasm": "/packages/backend-wasm/dist/index.js",
    "@synaptic/backend-webgpu": "/packages/backend-webgpu/dist/index.js"
  }
}
</script>
<script src="/node_modules/mnist/dist/mnist.js"></script>
<pre id="result">loading MNIST</pre>
<script type="module">
  import { WebGpuBackend } from "@synaptic/backend-webgpu";
  import {
    createMnistDataset,
    runDsrLearning,
    runMnistLearning,
    runXorLearning,
  } from "../../conformance/dist/index.js";

  const result = document.querySelector("#result");
  const backend = () => new WebGpuBackend({ fallbackBackends: [] });
  const timings = [];
  const progress = ({ workload, phase, completed, total }) => {
    result.textContent = `${workload} ${phase}: ${completed}/${total}`;
  };
  const timed = async (workload, run) => {
    const start = performance.now();
    const value = await run();
    timings.push({
      backend: value.backend,
      workload,
      durationMs: Math.round(performance.now() - start),
    });
    return value;
  };

  try {
    const dataset = createMnistDataset(window.mnist);
    const xor = await timed(
      "XOR",
      () => runXorLearning(backend(), { onProgress: progress }),
    );
    const mnist = await timed(
      "MNIST",
      () => runMnistLearning(backend(), dataset, { onProgress: progress }),
    );
    const dsr = await timed(
      "DSR",
      () => runDsrLearning(backend(), { onProgress: progress }),
    );
    const pass =
      xor.backend === "webgpu" &&
      xor.accuracy === 1 &&
      mnist.backend === "webgpu" &&
      mnist.trainingAccuracy >= 0.85 &&
      mnist.testAccuracy >= 0.8 &&
      dsr.backend === "webgpu" &&
      dsr.distractorAccuracy === 1 &&
      dsr.promptAccuracy >= 0.95 &&
      dsr.sequenceAccuracy >= 0.95;
    result.textContent = JSON.stringify({
      pass,
      xor,
      mnist,
      dsr,
      timings,
    });
  } catch (error) {
    result.textContent = JSON.stringify({
      error: error instanceof Error ? error.message : String(error),
      pass: false,
    });
  }
</script>
